name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Check generated sources
        run: |
          git diff --exit-code -- lib
          test -z "$(git status --porcelain --untracked-files=all -- lib)"

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage --branch-coverage --exclude-tags golden

      - name: Enforce coverage threshold
        run: |
          dart run tool/check_coverage.dart coverage/lcov.info \
            --min-line 70 \
            --min-branch 60 \
            --exclude-suffix .g.dart

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            platform: android
            os: ubuntu-latest
            build-command: flutter build apk --release
            artifact-name: android-apk
            artifact-path: build/app/outputs/flutter-apk/app-release.apk
          - name: iOS
            platform: ios
            os: macos-latest
            build-command: flutter build ios --release --no-codesign
            artifact-name: ios-app-unsigned
            artifact-path: build/ios/Runner-unsigned.zip
          - name: macOS
            platform: macos
            os: macos-latest
            build-command: flutter build macos --release
            artifact-name: macos-app-unsigned
            artifact-path: build/macos/sk120-macos-unsigned.zip
          - name: Windows
            platform: windows
            os: windows-latest
            build-command: flutter build windows --release
            artifact-name: windows-bundle
            artifact-path: build/windows/x64/runner/Release
          - name: Linux
            platform: linux
            os: ubuntu-latest
            build-command: flutter build linux --release
            artifact-name: linux-bundle
            artifact-path: build/linux/sk120-linux.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests on ${{ matrix.name }} host
        run: flutter test --exclude-tags golden

      - name: Run macOS golden tests
        if: matrix.platform == 'macos'
        run: flutter test test/golden

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build-command }}

      - name: Package iOS artifact
        if: matrix.platform == 'ios'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/Runner-unsigned.zip

      - name: Package macOS artifact
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/*.app build/macos/sk120-macos-unsigned.zip

      - name: Package Linux artifact
        if: matrix.platform == 'linux'
        run: tar -C build/linux/x64/release -czf build/linux/sk120-linux.tar.gz bundle

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
